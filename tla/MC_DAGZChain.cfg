\* Model checker configuration for DAGZChain

\* Small universes keep the per-vertex structure (nulls/commits are subsets of
\* the respective universes, rank in 1..MaxVertices) tractable. Two nullifiers
\* suffice to exhibit both conflicting and disjoint vertices, and MaxVertices
\* = 4 (with the Cardinality(accepted) <= 3 constraint) reaches multi-vertex
\* antichains across several ranks.
CONSTANTS
    Nullifiers = {n1, n2}
    Commitments = {c1, c2}
    MaxVertices = 4

SPECIFICATION Spec

CONSTRAINT StateConstraint

INVARIANTS
    TypeOK
    NoDoubleSpend
    AntichainDisjoint

PROPERTIES
    Liveness

CHECK_DEADLOCK FALSE
