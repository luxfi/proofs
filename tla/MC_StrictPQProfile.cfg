CONSTANTS
    Profiles = {strict, permissive, fips}
    LockedProfile = strict
    Schemes = {mldsa65, mldsa87, pulsar65, pulsar87, ecdsa, ed25519}
    StrictPQSchemes = {mldsa65, mldsa87, pulsar65, pulsar87}
    HashSuites = {sha3_384, sha2_256}
    StrictPQSuite = sha3_384
    MaxHeight = 3
    NULL = nullProfile

SPECIFICATION Spec

\* Bound admitted/signed scheme-sequence lengths so exploration terminates.
\* (AdmitTx appends without advancing height; see MC_StrictPQProfile.tla.)
CONSTRAINT StateConstraint

INVARIANTS
    StrictE2EPQ

\* BootResolves is the faithful, TRUE liveness property of the boot gate.
\* The former HeightProgresses / ProfileEventuallyLoaded properties were
\* removed because they are not theorems of the model (a node may legitimately
\* abort at boot and never progress / never load) -- see StrictPQProfile.tla.
PROPERTIES
    BootResolves
