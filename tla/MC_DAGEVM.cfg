\* Model checker configuration for DAGEVM

\* Small universes keep the per-vertex structure (reads/writes are subsets of
\* Keys, parents subsets of VertexId, rank in 1..MaxVertices) tractable. The
\* EVM conflict rule compares BOTH read and write sets, so each vertex has two
\* subset-valued fields and the accepted-set space grows much faster than for
\* Z-Chain (single nullifier field). Two keys still exhibit both conflicting
\* and disjoint read/write sets, and MaxVertices = 3 reaches sibling antichains
\* (two rank-1 vertices) and parent->child chains (rank 1 -> rank 2), covering
\* Safety, ConflictsAlongEdges, Serializability, NoDoubleSpend and Liveness.
CONSTANTS
    Keys = {k1, k2}
    MaxVertices = 3
    MaxTxsPerVertex = 3

SPECIFICATION Spec

CONSTRAINT StateConstraint

INVARIANTS
    TypeOK
    Safety
    NoDoubleSpend
    Serializability
    ConflictsAlongEdges

PROPERTIES
    Liveness

CHECK_DEADLOCK FALSE
