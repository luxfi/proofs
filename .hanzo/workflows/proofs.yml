name: proofs

# Builds the Lean corpus and reports what a green build cannot show: the axiom
# count, the declarations that state `True`, and the files no library compiles.
#
# The result is allowed to be bad. A red build is information.

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.hanzo/workflows/proofs.yml'
  workflow_dispatch:

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    runs-on: [linux-amd64]
    # Mathlib is the long pole even with the cache; a cold run is most of an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        # The toolchain comes from lean/lean-toolchain, so elan installs no
        # default and lake resolves the pinned version from the project.
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib
        working-directory: lean
        # Building Mathlib from source is hours; the upstream cache is the
        # difference between a job that runs on every push and one that never does.
        run: lake exe cache get

      - name: lake build
        working-directory: lean
        # The whole corpus: every library in lakefile.lean is a default target.
        run: lake build

      - name: Files the build never compiled
        # Asked of the build's own output rather than of an import parser: a
        # source file with no .olean was not checked, whatever the lakefile
        # claims. A file in no library is invisible to CI while looking covered.
        if: always()
        working-directory: lean
        run: |
          set -euo pipefail
          find . -name '*.lean' ! -name 'lakefile.lean' -not -path './.lake/*' \
            | sed 's|^\./||; s|\.lean$||; s|/|.|g' | sort > /tmp/source
          find .lake/build/lib -name '*.olean' 2>/dev/null \
            | sed 's|.*\.lake/build/lib/||; s|\.olean$||; s|/|.|g' | sort > /tmp/built
          missed=$(comm -23 /tmp/source /tmp/built)
          n=$(printf '%s' "${missed}" | grep -c . || true)
          echo "source modules: $(wc -l < /tmp/source), compiled: $(wc -l < /tmp/built), never compiled: ${n}"
          if [ "${n}" -gt 0 ]; then printf '%s\n' "${missed}"; fi
          {
            echo "### Never compiled"
            echo ""
            echo "${n} of $(wc -l < /tmp/source) modules are in no library."
            if [ "${n}" -gt 0 ]; then printf '%s\n' "${missed}" | sed 's/^/- `/; s/$/`/'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What each theorem rests on
        # `#print axioms` per theorem, which is the only thing that
        # distinguishes a proof from an assumption handed to itself. A theorem
        # resting on propext / Classical.choice / Quot.sound alone is proved;
        # anything else it names is load-bearing. See lean/axioms.py.
        if: always()
        working-directory: lean
        run: |
          set -euo pipefail
          python3 axioms.py . | tee /tmp/axioms.txt
          {
            echo "### What each theorem rests on"
            echo ""
            echo '```'
            tail -28 /tmp/axioms.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What the corpus assumes
        # An axiom is an assumption; a vacuous one is not even that. Both counts
        # go in every run's summary so the trend is visible rather than
        # rediscovered by an audit. See lean/vacuity.py.
        if: always()
        working-directory: lean
        run: |
          set -euo pipefail
          ax=$(grep -rhc '^axiom' --include='*.lean' --exclude-dir=.lake . | awk '{s+=$1} END {print s+0}')
          th=$(grep -rhc '^theorem\|^lemma' --include='*.lean' --exclude-dir=.lake . | awk '{s+=$1} END {print s+0}')
          python3 vacuity.py . | tail -3
          vac=$(python3 vacuity.py . | sed -n 's/^vacuous declarations: \([0-9]*\).*/\1/p')
          {
            echo "### Lean corpus"
            echo ""
            echo "| | count |"
            echo "|---|---:|"
            echo "| theorems and lemmas | ${th} |"
            echo "| axioms | ${ax} |"
            echo "| carrying no content | ${vac} |"
          } >> "$GITHUB_STEP_SUMMARY"
