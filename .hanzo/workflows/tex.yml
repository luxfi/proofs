name: tex

# Compiles every top-level .tex in the repo and checks its citations, on the
# native runners (git.hanzo.ai → git-runner). The Lean corpus is built
# separately by proofs.yml; this is the paper half.
#
# This replaces .github/workflows/fresh-clone-ci.yml, which has not run since
# .hanzo/workflows/proofs.yml was added: the forge stops at the first workflow
# directory that exists, so the whole of .github/workflows went dark the moment
# .hanzo/workflows appeared. The 25 .tex documents here have had no CI since.
#
# Two things about that workflow could not have worked anyway.
#
# It ran on `runs-on: ubuntu-latest`. No runner on this forge carries that
# label, and a job naming a label nothing carries does not fail — it waits.
#
# And it did not build the commit that triggered it. Rather than checking out
# the workspace it ran
#
#     git clone --depth 1 https://github.com/${GITHUB_REPOSITORY}.git repo
#     git fetch --depth 1 origin "${GITHUB_SHA}"
#
# — unauthenticated, against github.com, from a forge whose repository is a
# different host's mirror. The isolation that was reaching for comes from the
# ubuntu:24.04 container, which is kept; the source now comes from
# actions/checkout, so what is compiled is what was pushed.

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '.hanzo/workflows/tex.yml'
  pull_request:
    paths:
      - '**/*.tex'
      - '**/*.bib'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latexmk:
    name: Compile every .tex
    runs-on: [lux-build-linux-amd64]
    container:
      image: ubuntu:24.04
    timeout-minutes: 60
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science \
            texlive-bibtex-extra biber latexmk make \
            > /dev/null

      - uses: actions/checkout@v4

      # Outputs go to _build/ inside the workspace. The old job wrote them to
      # `../` because it had cloned into a `repo/` subdirectory, so `..` was the
      # workspace; checked out at the workspace root, `..` is outside it.
      - name: Find all top-level .tex documents
        run: |
          set -euo pipefail
          # A "top-level" .tex is one that contains \documentclass. Each is
          # compiled independently; subfiles reached by \input are compiled by
          # their parent, not directly.
          mkdir -p _build/pdfs _build/logs
          grep -rlE '^\s*\\documentclass' --include='*.tex' . \
            | grep -v -e '^\./_build/' -e '^\./lean/\.lake/' \
            | sort -u > _build/tex-docs.txt
          echo 'top-level documents:'
          sed 's/^/  /' _build/tex-docs.txt

      - name: Compile each .tex via latexmk
        run: |
          set -euo pipefail
          build="${GITHUB_WORKSPACE}/_build"
          while IFS= read -r doc; do
            [ -z "$doc" ] && continue
            doc_dir="$(dirname "$doc")"
            doc_base="$(basename "$doc" .tex)"
            log="${build}/logs/${doc_base}.latexmk.log"
            echo "==> latexmk $doc"
            ( cd "$doc_dir" && \
              latexmk -pdf -interaction=nonstopmode -halt-on-error \
                -file-line-error "$doc_base.tex" > "$log" 2>&1 ) || {
              echo "::error file=$doc::latexmk failed for $doc"
              cat "$log" || true
              exit 1
            }
            cp "$doc_dir/$doc_base.pdf" "${build}/pdfs/" 2>/dev/null || \
              echo "::warning::no PDF emitted for $doc"
          done < _build/tex-docs.txt

      - name: Citation check via bibtex
        run: |
          # bibtex is already invoked by latexmk; surface its "I didn't find a
          # database entry for" warnings as a hard failure.
          fail=0
          while IFS= read -r doc; do
            [ -z "$doc" ] && continue
            doc_dir="$(dirname "$doc")"
            doc_base="$(basename "$doc" .tex)"
            blg="$doc_dir/$doc_base.blg"
            [ -f "$blg" ] || continue
            if grep -E 'I didn.t find a database entry for|Citation .+ undefined' "$blg"; then
              echo "::error file=$doc::bibtex citation errors in $blg"
              fail=1
            fi
          done < _build/tex-docs.txt
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ github.sha }}
          path: _build/pdfs/
          if-no-files-found: error
          retention-days: 90

      - name: Upload latexmk logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.sha }}
          path: _build/logs/
          if-no-files-found: warn
          retention-days: 90
